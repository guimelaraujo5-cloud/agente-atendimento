version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: guimel
      POSTGRES_USER: guimel
      POSTGRES_PASSWORD: guimel
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guimel -d guimel"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
